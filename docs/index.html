<!-- Floating Contact Chatbox -->
<div class="chat-container" id="chatContainer">

    <button
        type="button"
        id="chatToggle"
        class="chat-toggle"
        aria-expanded="false"
        aria-controls="chatPanel">
        Leave a Message
    </button>

    <div class="chat-panel" id="chatPanel" hidden>
        <div class="chat-header">
            <h3>Send a Little Note</h3>
            <button
                type="button"
                id="chatClose"
                class="chat-close"
                aria-label="Close chatbox">
                ×
            </button>
        </div>

        <p>I'd love to hear from you!</p>

        <form action="send-email.php" method="POST">
            <label for="chatName">Your Name</label>
            <input
                type="text"
                id="chatName"
                name="name"
                maxlength="100"
                required>

            <label for="chatEmail">Your Email</label>
            <input
                type="email"
                id="chatEmail"
                name="email"
                maxlength="254"
                required>

            <label for="chatMessage">Your Message (50 words max)</label>
            <textarea
                id="chatMessage"
                name="message"
                rows="4"
                maxlength="350"
                required></textarea>

            <p id="wordCount">0 / 50 words</p>

            <button type="submit" class="chat-send">
                Send Message
            </button>
        </form>
    </div>
</div>
