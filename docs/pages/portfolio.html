<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Wedding & Event Gallery</title>
  <link rel="stylesheet" href="../styles.css">
  <script src="../scripts/script.js" defer></script>
</head>
<body>

<!-- Hamburger Button -->
<button class="menu-toggle" id="menu-toggle"
        aria-label="Open navigation menu"
        aria-expanded="false"
        aria-controls="sidebar">
    <span></span>
    <span></span>
    <span></span>
</button>

<!-- Dark Overlay -->
<div class="sidebar-overlay" id="sidebar-overlay"></div>

<!-- Sidebar Navigation -->
<nav class="sidebar" id="sidebar" aria-hidden="true">

    <button class="close-sidebar" id="close-sidebar"
            aria-label="Close navigation menu">
        &times;
    </button>

    <img src="images/logo.png" class="sidebar_logo">

    <ul>
        <li><a href="pages/index.html">Home</a></li>
        <li><a href="pages/about.html">About</a></li>
        <li><a href="pages/portfolio.html" class="active">Gallery</a></li>
        <li><a href="pages/pricing.html">Pricing & Planning</a></li>
        <li><a href="pages/contact.html">Contact Me</a></li>
    </ul>

    <div class="sidebar-footer">
        <p>Capturing moments<br>that last forever.</p>
    </div>

</nav>
  
<header class="hero">
  <h1>Wedding & Event Gallery</h1>
  <p>Timeless photography captured with elegance</p>
</header>

<section class="gallery-section">
  <h2>Wedding Moments</h2>
  <div class="gallery-grid">
    <a href="../images/Portfolio/slide1.jpg" class="gallery-item"><img src="../images/Portfolio/slide1.jpg" alt=""></a>
    <a href="../images/Portfolio/slide2.jpg" class="gallery-item"><img src="../images/Portfolio/slide2.jpg" alt=""></a>
    <a href="../img/wed3.jpg" class="gallery-item"><img src="img/wed3.jpg" alt=""></a>
    <a href="../img/wed4.jpg" class="gallery-item"><img src="img/wed4.jpg" alt=""></a>
  </div>
</section>

<section class="gallery-section">
  <h2>Event Highlights</h2>
  <div class="gallery-grid">
    <a href="../images/Portfolio/Slide1.1.jpg" class="gallery-item"><img src="../images/Portfolio/Slide1.1.jpg" alt=""></a>
    <a href="../images/Portfolio/Slide1.2.jpg" class="gallery-item"><img src="../images/Portfolio/Slide1.2.jpg" alt=""></a>
    <a href="../images/Portfolio/Slide1.3.jpg" class="gallery-item"><img src="../images/Portfolio/Slide1.3.jpg" alt=""></a>
    <a href="../images/Portfolio/Slide1.4.jpg" class="gallery-item"><img src="../images/Portfolio/Slide1.4.jpg" alt=""></a>
  </div>
</section>

<!-- Lightbox -->
<div id="lightbox" class="lightbox">
  <img id="lightbox-img" src="" alt="">
</div>

<footer class="social-footer">
    <p>Follow My Photography</p>

    <div class="social-icons">
        <a href="https://www.facebook.com/YOUR-PAGE"
           target="_blank"
           rel="noopener noreferrer"
           aria-label="Visit Facebook">
            <img src="https://cdn.simpleicons.org/facebook/1877F2"
                 alt="Facebook">
        </a>

        <a href="https://www.instagram.com/arana.patty/"
           target="_blank"
           rel="noopener noreferrer"
           aria-label="Visit Instagram">
            <img src="https://cdn.simpleicons.org/instagram/E4405F"
                 alt="Instagram">
        </a>
    </div>

    <p class="social-copyright">
        © 2026 Patty Arana Photo
    </p>
</footer>

<script>
  const lightbox = document.getElementById("lightbox");
  const lightboxImg = document.getElementById("lightbox-img");

  document.querySelectorAll(".gallery-item").forEach(item => {
    item.addEventListener("click", e => {
      e.preventDefault();
      lightboxImg.src = item.href;
      lightbox.classList.add("active");
    });
  });

  lightbox.addEventListener("click", () => {
    lightbox.classList.remove("active");
  });
</script>

</body>
</html>
